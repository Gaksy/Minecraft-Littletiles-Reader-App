<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576"
     font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, sans-serif">
  <defs>
    <style>
      .title   { font-size: 22px; font-weight: 700; fill: #1f2937; }
      .subtitle{ font-size: 13px; fill: #6b7280; }
      .panel   { fill: #ffffff; stroke: #e5e7eb; stroke-width: 1.5; rx: 10; }
      .head    { font-size: 16px; font-weight: 700; }
      .needs   { font-size: 13px; fill: #374151; }
      .example { font-size: 12.5px; fill: #6b7280; }
      .axis    { font-size: 12px; fill: #9ca3af; }
      .badge   { font-size: 11.5px; fill: #ffffff; font-weight: 700; }
      .cellline{ stroke: #dcdcdc; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1240" height="576" fill="#f7f8fa"/>

  <text x="40" y="42" class="title">存档导出：三种区块选择模式</text>
  <text x="40" y="64" class="subtitle">俯视图（上 = 北 / −z，右 = 东 / +x）。每一小格 = 1 个区块（16×16 方块）；粗矩形 = 实际导出的范围。</text>

  <!-- ============================ 模式 A：单区块 ============================ -->
  <g>
    <rect class="panel" x="40" y="84" width="380" height="456"/>
    <text x="60" y="116" class="head" fill="#2563eb">模式 A · 单区块</text>

    <!-- 网格：7×7，格 34px，原点 (111,140) -->
    <rect x="111" y="140" width="238" height="238" fill="#fcfcfd"/>
    <path class="cellline" d="M145,140V378 M179,140V378 M213,140V378 M247,140V378 M281,140V378 M315,140V378"/>
    <path class="cellline" d="M111,174H349 M111,208H349 M111,242H349 M111,276H349 M111,310H349 M111,344H349"/>
    <rect x="111" y="140" width="238" height="238" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- 选中：1 格（中心格 3,3） -->
    <rect x="213" y="242" width="34" height="34" fill="#93c5fd"/>
    <rect x="213" y="242" width="34" height="34" fill="none" stroke="#2563eb" stroke-width="3"/>

    <!-- 坐标轴 -->
    <path d="M111,394H360" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M93,140V378" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="352" y="390" class="axis">x →</text>
    <text x="76" y="150" class="axis">z ↓</text>

    <text x="60" y="432" class="needs">需要输入：区块坐标 (x, z)</text>
    <text x="60" y="454" class="example">例如 (12, −3) → 导出 1 个区块</text>
    <text x="60" y="474" class="example">最小范围，用于补导漏掉的单块</text>
  </g>

  <!-- ============================ 模式 B：区块范围 ============================ -->
  <g>
    <rect class="panel" x="430" y="84" width="380" height="456"/>
    <text x="450" y="116" class="head" fill="#059669">模式 B · 区块范围</text>

    <rect x="501" y="140" width="238" height="238" fill="#fcfcfd"/>
    <path class="cellline" d="M535,140V378 M569,140V378 M603,140V378 M637,140V378 M671,140V378 M705,140V378"/>
    <path class="cellline" d="M501,174H739 M501,208H739 M501,242H739 M501,276H739 M501,310H739 M501,344H739"/>
    <rect x="501" y="140" width="238" height="238" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- 选中：3×3（格 2..4） -->
    <rect x="569" y="208" width="102" height="102" fill="#a7f3d0"/>
    <!-- 两个角点单独标出 -->
    <rect x="569" y="208" width="34" height="34" fill="#34d399"/>
    <rect x="637" y="276" width="34" height="34" fill="#34d399"/>
    <rect x="569" y="208" width="102" height="102" fill="none" stroke="#059669" stroke-width="3"/>
    <text x="576" y="230" class="badge">起</text>
    <text x="644" y="298" class="badge">止</text>

    <path d="M501,394H750" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M483,140V378" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="742" y="390" class="axis">x →</text>
    <text x="466" y="150" class="axis">z ↓</text>

    <text x="450" y="432" class="needs">需要输入：两个角点的区块坐标</text>
    <text x="450" y="454" class="example">起点 (10, −5) + 终点 (12, −3) → 3×3</text>
    <text x="450" y="474" class="example">范围任意矩形（长宽可不等），含两端</text>
  </g>

  <!-- ============================ 模式 C：中心 + 半径 ============================ -->
  <g>
    <rect class="panel" x="820" y="84" width="380" height="456"/>
    <text x="840" y="116" class="head" fill="#d97706">模式 C · 中心 + 半径</text>

    <rect x="891" y="140" width="238" height="238" fill="#fcfcfd"/>
    <path class="cellline" d="M925,140V378 M959,140V378 M993,140V378 M1027,140V378 M1061,140V378 M1095,140V378"/>
    <path class="cellline" d="M891,174H1129 M891,208H1129 M891,242H1129 M891,276H1129 M891,310H1129 M891,344H1129"/>
    <rect x="891" y="140" width="238" height="238" fill="none" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- r=2 的边界（虚线）：格 1..5 -->
    <rect x="925" y="174" width="170" height="170" fill="none" stroke="#d97706"
          stroke-width="2" stroke-dasharray="7 5"/>
    <!-- r=1 的实际范围（实心）：格 2..4 -->
    <rect x="959" y="208" width="102" height="102" fill="#fde68a"/>
    <!-- 中心格 -->
    <rect x="993" y="242" width="34" height="34" fill="#f59e0b"/>
    <rect x="959" y="208" width="102" height="102" fill="none" stroke="#d97706" stroke-width="3"/>
    <circle cx="1010" cy="259" r="3.5" fill="#ffffff"/>

    <path d="M891,394H1140" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M873,140V378" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1132" y="390" class="axis">x →</text>
    <text x="856" y="150" class="axis">z ↓</text>

    <text x="840" y="432" class="needs">需要输入：中心的区块坐标 + 半径 r</text>
    <text x="840" y="454" class="example">中心 (11, −4)、r = 1 → 3×3（实心）</text>
    <text x="840" y="474" class="example">虚线是 r = 2 → 5×5；即边长 = 2r+1，永远是正方形</text>
  </g>
</svg>
